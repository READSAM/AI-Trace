services:
  # 1. In-Memory Redis Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: aitrace_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aitrace_net

  # 2. FastAPI Orchestrator (API Gateway)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args: 
        HF_TOKEN: ${HF_TOKEN}
    container_name: aitrace_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - shared-artifacts:/tmp/aitrace_artifacts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aitrace_net

  # 3. CPU Worker Pool (Image & Text Forensics Pipelines)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_TOKEN: ${HF_TOKEN}
    container_name: aitrace_celery_worker
    # Consumes both CPU and GPU task queues on system CPU threads
    command: celery -A app.tasks.celery_app worker -Q queue_cpu,queue_gpu --loglevel=info --concurrency=2
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - shared-artifacts:/tmp/aitrace_artifacts
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aitrace_net

volumes:
  shared-artifacts:
    driver: local

networks:
  aitrace_net:
    driver: bridge